spring.application.name=movieticket
server.port=8080

# Oracle XE connection
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=HR
spring.datasource.password=hr

# Table movieMM and sequence movieMM_seq are created by running movieMM.sql in SQL Developer
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Keep names exactly as written (ticketId, movieName, movieMM)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl